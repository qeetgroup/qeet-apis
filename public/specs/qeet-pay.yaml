openapi: 3.1.0
info:
  title: Qeet Pay API
  version: v1
  description: India-first payments, billing and GST infrastructure (UPI / Cards / NACH) — payments and payouts, billing, tax, risk, embedded finance and platform APIs. Money is always in integer minor units (paise).
  contact:
    name: Qeet Group
    url: https://qeet.in
  license:
    name: Proprietary
    url: https://qeet.in
servers:
  - url: https://api.pay.qeet.in
    description: Production
  - url: https://api.pay.staging.qeet.in
    description: Staging
  - url: http://localhost:4201
    description: Local (docker compose)
security:
  - API-Key: []
tags:
  - name: Orchestration
    description: Smart provider routing — scorecards and cost basis.
  - name: Virtual Accounts
    description: Per-customer virtual accounts with auto-reconciled credits.
  - name: Payments
    description: Accept payments — create authorizes, capture posts the ledger entry (idempotent), read and list.
  - name: Payment Links
    description: Create, read, list and cancel shareable payment links (fixed or open amount), and pay a link by its code.
  - name: Offline
  - name: Mandates
    description: Recurring-mandate lifecycle (create → activate → pause/resume → revoke) and idempotent mandate debits.
  - name: Checkout
    description: Public hosted-checkout — resolve a payment link by code and pay it with no merchant API key.
  - name: Treasury
    description: Programmable money — auto-sweep rules that move idle cash between ledger accounts, plus an advisory idle-cash recommendation.
  - name: Reconciliation
    description: Ingest provider settlement reports — post the money movement and auto-reconcile against captured payments.
  - name: Payroll
  - name: Payouts
    description: Create, approve (maker-checker, idempotent) and reject single payouts; approval disburses and posts to the ledger.
  - name: Ledger
    description: Double-entry ledger accounts and balanced journal entries.
  - name: Billing
    description: Plans, subscriptions, invoices and usage metering, with lifecycle actions (upgrade/downgrade/pause/resume/cancel).
  - name: Revenue Recognition
    description: IndAS 115 revenue schedules — defer revenue, recognise due periods, and read schedules with their slices.
  - name: Dunning
    description: Failed-payment retry rules and attempt history.
  - name: TDS / TCS Returns
    description: Prepare, export, and file quarterly TDS/TCS statutory returns (Form 24Q/26Q/27EQ).
  - name: TDS / TCS
    description: Tax-at-source deductions, certificates and summaries.
  - name: Input Tax Credit
    description: Record inward-supply purchase invoices, reconcile them against supplier-filed GSTR-2B, and report eligible ITC.
  - name: GST Returns
    description: Prepare GSTR-1/GSTR-3B returns for a tax period from merchant invoices and file them to GSTN (ARN).
  - name: GST AI
    description: AI-assisted HSN/SAC classification and the Regulatory-Change Impact Radar — both via the AiGateway §6.4 safety matrix with a deterministic fallback.
  - name: GST Invoicing
    description: Issue GST credit/debit notes against invoices and manage multi-GSTIN registration.
  - name: E-Invoicing (IRN)
    description: Register a GST invoice at the IRP to obtain its IRN + signed QR; read IRN details and cancel within the window.
  - name: ONDC
    description: 'Multi-party settlement for ONDC network orders: create with per-party lines, fulfil, settle post-fulfilment (commission + GST + statutory TCS §52), and cancel.'
  - name: Marketplace
    description: Seller registration and split settlements (TCS/TDS).
  - name: Lending
    description: Working-capital advances — request/accept offers (disburses funds) and apply settlement sweeps to repayment.
  - name: Insurance
    description: Embedded insurance — issue protection policies (collecting premium) and file, approve or reject claims.
  - name: ESG / Carbon
    description: Per-transaction carbon footprint and offsets.
  - name: Escrow
    description: Conditional escrow — hold buyer funds, release (partly) to the seller or refund to the buyer, with event history.
  - name: Cross-Border — Outbound
    description: Outbound/import remittances to foreign vendors via SWIFT, with LRS tracking + 2.5% TCS.
  - name: Cross-Border
    description: Export invoices and inward FX remittances (FIRA).
  - name: Cards
    description: Virtual expense/wallet cards — issue, load funds, spend, freeze/unfreeze/close, and read transaction history.
  - name: BNPL
    description: Buy-Now-Pay-Later installment agreements.
  - name: KYB V-CIP
    description: Video-based Customer Identification Process — schedule and run video-KYC sessions for a merchant's signatory (RBI Master Directions).
  - name: KYB UBO
    description: Ultimate Beneficial Owner registry — natural persons holding > 10% equity (RBI Master Directions).
  - name: KYB
    description: Merchant Know-Your-Business — submit PAN / GSTIN / bank details and query overall verification status.
  - name: Customer KYC
    description: End-customer KYC — Aadhaar-OTP e-KYC (simulated) + PAN verification + consent capture.
  - name: AML
    description: Sanctions/PEP screening, transaction monitoring, mule-account detection, and STR generation/filing with FIU-IND.
  - name: Fraud
    description: Fraud-scoring decision audit — score, verdict, and the Explainable-AI top reasons.
  - name: Messaging
    description: WhatsApp/SMS/email templates and rendered dispatch (queued to qeet-notify via the outbox); delivery callbacks.
  - name: Accounting
    description: Export a period's ledger journal entries + GST invoices to Tally / Zoho Books / SAP Business One / a webhook, and manage connections.
  - name: Webhooks
    description: Register webhook endpoints (event subscriptions + signing secret) and view delivery history.
  - name: Messaging — WhatsApp
    description: Inbound WhatsApp webhook + subscription command bot, and in-chat WhatsApp Pay collections (sandbox rail).
  - name: Merchants
    description: Merchant onboarding (mints an API key + seeds the chart of accounts) and the current-merchant profile.
  - name: Copilot
    description: LLM copilots — treasury & cash-flow, reconciliation, and natural-language query over the merchant's own data. Every answer cites its figures, routes through the AI gateway, and is persisted for audit.
  - name: Agentic Mandates
    description: AI-agent mandates — scoped, capped, revocable authority with a deterministic authorize decision.
  - name: Platform
    description: Resolved request identity — the current merchant plus the Qeet ID JWT subject/roles (null under an API key).
  - name: Analytics
    description: Business metrics — TPV, MRR waterfall, ARR, success rate, and settlement cash-flow forecasting.
  - name: AI
    description: AI gateway decision audit — the trail every AI feature writes through the §6.4 safety matrix.
  - name: Agentic MCP
    description: Model-Context-Protocol tool manifest — the safe tools an AI agent may call.
