      - Dunning
  - name: GST & Tax
    tags:
      - TDS / TCS Returns
      - TDS / TCS
      - Input Tax Credit
      - GST Returns
      - GST AI
      - GST Invoicing
      - E-Invoicing (IRN)
  - name: Commerce & Embedded Finance
    tags:
      - ONDC
      - Marketplace
      - Lending
      - Insurance
      - ESG / Carbon
      - Escrow
      - Cross-Border — Outbound
      - Cross-Border
