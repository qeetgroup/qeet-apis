          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            maximum: 1000
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Delivery events
          content:
            application/json:
              schema:
                type: object
                required:
                  - events
                  - limit
                  - offset
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeliveryEvent'
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/batching/rules:
    get:
      summary: List batching rules
      operationId: get_v1_batching_rules
      tags:
        - Batching
      security:
        - API-Key: []
      responses:
        '200':
          description: Batching rules
          content:
            application/json:
              schema:
                type: object
                required:
                  - rules
                properties:
                  rules:
                    type: array
                    items:
                      $ref: '#/components/schemas/BatchingRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create or upsert a batching rule
      description: Idempotent on the (channel, category) pair — re-posting the same pair replaces the rule.
      operationId: post_v1_batching_rules
      tags:
        - Batching
      security:
        - API-Key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchingRule'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - channel
                  - category
                properties:
                  id:
                    type: string
                    format: uuid
                  channel:
                    type: string
                  category:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/batching/rules/{id}:
    put:
      summary: Update a batching rule
      operationId: put_v1_batching_rules_ById
      tags:
        - Batching
      security:
        - API-Key: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchingRule'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                properties:
                  id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      summary: Delete a batching rule
      operationId: delete_v1_batching_rules_ById
      tags:
        - Batching
      security:
        - API-Key: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    API-Key:
      type: apiKey
      in: header
      name: X-Qeet-Api-Key
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required:
        - error
    PaginatedMeta:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    Channel:
      type: string
      description: Delivery channel.
      enum:
        - email
        - sms
        - whatsapp
        - push
        - inapp
        - webhook
        - rcs
        - chatops
    Template:
      type: object
      description: A Handlebars notification template, versioned via metadata.
      required:
        - id
        - name
        - channel
        - locale
        - body
        - metadata
        - is_active
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        channel:
          $ref: '#/components/schemas/Channel'
        locale:
          type: string
          description: BCP-47 locale (e.g. "en").
        subject:
          type: string
          description: Email subject line; omitted for channels without a subject.
        body:
          type: string
          description: Handlebars template body.
        metadata:
          type: object
          additionalProperties: true
          description: Free-form metadata; carries the version marker.
        is_active:
          type: boolean
        version:
          type: integer
          description: Template version (derived from metadata.version; defaults to 1).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Workflow:
      type: object
      description: A multi-step, event-triggered notification journey.
      required:
        - id
        - name
        - trigger_event
        - steps
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        trigger_event:
          type: string
          description: Event name that triggers this workflow.
          example: user.welcome
        steps:
          type: array
          description: Ordered workflow steps (channel sends, delays, branches).
          items:
            type: object
            additionalProperties: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkflowRun:
      type: object
      description: One execution of a workflow for a subscriber.
      required:
        - id
        - workflow_id
        - trigger_event
        - status
        - current_step_index
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
        subscriber_id:
          type: string
          format: uuid
          description: Subscriber the run targets; omitted when not set.
        trigger_event:
          type: string
        status:
          type: string
          enum:
            - running
            - completed
            - failed
            - cancelled
        current_step_index:
          type: integer
          description: Zero-based index of the current/last step.
        error:
          type: string
          description: Failure reason; omitted unless the run failed.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Notification:
      type: object
      description: A single delivered (or attempted) notification record.
      required:
        - id
        - subscriber_id
        - channel
        - status
        - content
        - is_read
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        workflow_run_id:
          type: string
          format: uuid
          description: Set when produced by a workflow run.
        subscriber_id:
          type: string
          format: uuid
        channel:
          $ref: '#/components/schemas/Channel'
        template_id:
          type: string
          format: uuid
          description: Template used to render the notification, if any.
        status:
          type: string
          enum:
            - pending
            - queued
            - sent
            - delivered
            - failed
            - skipped
        provider:
          type: string
          description: Provider that handled delivery (e.g. ses, msg91).
        provider_message_id:
          type: string
          description: Provider-assigned message identifier.
        content:
          type: object
          additionalProperties: true
          description: Rendered channel payload.
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DeliveryEvent:
      type: object
      description: A provider-reported lifecycle event for a notification.
      required:
        - id
        - event_type
        - provider
        - occurred_at
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
          description: e.g. queued, sent, delivered, opened, clicked, bounced, failed.
        provider:
          type: string
        occurred_at:
          type: string
          format: date-time
    ExperimentVariant:
      type: object
      description: One arm of an A/B experiment.
      required:
        - key
        - template_id
      properties:
        key:
          type: string
          description: Unique variant identifier within the experiment.
        template_id:
          type: string
          format: uuid
          description: Template sent for this variant.
        weight:
          type: integer
          minimum: 0
          description: Relative split weight (non-negative); equal weights = even split.
    Experiment:
      type: object
      description: An A/B test over template variants for a target template.
      required:
        - id
        - name
        - target_template_id
        - variants
        - status
        - winner_key
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        target_template_id:
          type: string
          format: uuid
          description: The control template the experiment replaces while running.
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ExperimentVariant'
        status:
          type: string
          enum:
            - draft
            - running
            - completed
        winner_key:
          type:
            - string
            - 'null'
          description: The promoted variant key; null until the experiment completes.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    VariantResult:
      type: object
      description: Per-variant delivery and engagement metrics.
      required:
        - key
        - sent
        - delivered
        - opened
        - clicked
        - open_rate
        - click_rate
      properties:
        key:
          type: string
        sent:
          type: integer
        delivered:
          type: integer
        opened:
          type: integer
        clicked:
          type: integer
        open_rate:
          type: number
          format: float
        click_rate:
          type: number
          format: float
    EventFamilyMembership:
      type: object
      properties:
        family_key:
          type: string
          description: The logical story this event belongs to.
        event_name:
          type: string
          description: The trigger event that is a member of the family.
      required:
        - family_key
        - event_name
    Subscriber:
      type: object
      description: A notification recipient. PII (email/phone/whatsapp_id) is encrypted at rest and is not returned by list/get; use the data-export endpoint for decrypted PII.
      properties:
        id:
          type: string
          format: uuid
        external_id:
          type: string
        locale:
          type: string
        timezone:
          type: string
        metadata:
          type: object
          additionalProperties: true
        is_deleted:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SubscriberIDResponse:
      type: object
      description: Identifier of the affected subscriber.
      properties:
        id:
          type: string
          format: uuid
      required:
        - id
    Preference:
      type: object
      description: A single channel+category opt-in state.
      properties:
        channel:
          type: string
        category:
          type: string
        is_opted_in:
          type: boolean
    PreferenceMatrix:
      type: object
      properties:
        preferences:
          type: array
          items:
            $ref: '#/components/schemas/Preference'
    ConsentEntry:
      type: object
      description: One append-only DPDP consent-ledger record.
      properties:
        channel:
          type: string
        category:
          type: string
        opted_in:
          type: boolean
        source:
          type: string
        purpose:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        actor:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    Device:
      type: object
      description: A registered push token (element of the subscriber's push_tokens array).
      properties:
        provider:
          type: string
          enum:
            - fcm
            - apns
            - webpush
        token:
          type: string
          description: FCM/APNs device token, or (webpush) the subscription endpoint URL.
        platform:
          type: string
          enum:
            - android
            - ios
            - web
        p256dh:
          type: string
          nullable: true
          description: 'webpush only: subscription client public key (base64url).'
        auth:
          type: string
          nullable: true
          description: 'webpush only: subscription client auth secret (base64url).'
    DataExport:
      type: object
      description: Full DPDP data-subject-rights export for one subscriber — decrypted profile PII, current preference matrix, and full consent history.
      properties:
        subscriber:
          type: object
          properties:
            id:
              type: string
              format: uuid
            external_id:
              type: string
            email:
              type: string
              format: email
              nullable: true
            phone:
              type: string
              format: phone
              nullable: true
            whatsapp_id:
              type: string
              nullable: true
            locale:
              type: string
            timezone:
              type: string
            metadata:
              type: object
              additionalProperties: true
            is_deleted:
              type: boolean
            created_at:
              type: string
              format: date-time
        preferences:
          type: array
          items:
            $ref: '#/components/schemas/Preference'
        consent_history:
          type: array
          items:
            $ref: '#/components/schemas/ConsentEntry'
    IPWarmupPool:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        stream:
          type: string
          nullable: true
        provider:
          type: string
        is_dedicated:
          type: boolean
        warmup_started_on:
          type: string
          format: date
        target_daily_volume:
          type: integer
        status:
          type: string
          enum:
            - active
            - paused
            - completed
        throttled:
          type: boolean
    DeadLetter:
      type: object
      properties:
        id:
          type: string
          format: uuid
        channel:
          type: string
        subject:
          type: string
          description: Original channel subject the job is redriven to
        payload:
          type: object
          additionalProperties: true
          description: The original ChannelJob
        error:
          type: string
          nullable: true
        attempts:
          type: integer
        status:
          type: string
          enum:
            - pending
            - redriven
            - discarded
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
    Provider:
      type: object
      description: A provider config (credentials are never returned).
      properties:
        id:
          type: string
          format: uuid
        channel:
          type: string
        provider:
          type: string
        priority:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Suppression:
      type: object
      properties:
        id:
          type: string
          format: uuid
        channel:
          type: string
        value_hash:
          type: string
          description: SHA-256 of the suppressed address; plaintext is never stored.
        reason:
          type: string
          enum:
            - hard_bounce
            - spam_complaint
            - manual
            - unsubscribe
            - ndnc
        created_at:
          type: string
          format: date-time
    DltTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        carrier:
          type: string
        channel:
          type: string
          enum:
            - sms
            - whatsapp
        template_id_ext:
          type: string
          description: TRAI DLT template ID or Meta template name
        template_name:
          type: string
        pe_id:
          type: string
          nullable: true
        sender_id:
          type: string
          nullable: true
        category:
          type: string
          enum:
            - transactional
            - promotional
            - service_explicit
            - service_implicit
        body_regex:
          type: string
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NdncEntry:
      type: object
      description: A national DND entry — phone hash only, not tenant-scoped.
      properties:
        phone_hash:
          type: string
          description: SHA-256 of the phone number.
        category:
          type: string
        source:
          type: string
          enum:
            - manual
            - trai_sync
        created_at:
          type: string
          format: date-time
    SenderDomain:
      type: object
      properties:
        id:
          type: string
          format: uuid
        domain:
          type: string
        dkim_selector:
          type: string
        spf_verified:
          type: boolean
        dkim_verified:
          type: boolean
        dmarc_verified:
          type: boolean
        last_checked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    ReputationSnapshot:
      type: object
      properties:
        channel:
          type: string
          example: email
        sent:
          type: integer
        bounced:
          type: integer
        complained:
          type: integer
        bounce_rate:
          type: number
        complaint_rate:
          type: number
        status:
          type: string
          enum:
            - healthy
            - at_risk
            - critical
    InboundMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        channel:
          type: string
        provider:
          type: string
          nullable: true
        from_ref:
          type: string
          nullable: true
          description: Last-4 masked sender reference; the raw address is never returned.
        body:
          type: string
          nullable: true
        received_at:
          type: string
          format: date-time
    WaNumber:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone_number_id:
          type: string
        label:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    CompliancePane:
      type: object
      properties:
        regime:
          type: string
          example: dlt_sms
        status:
          type: string
          enum:
            - green
            - amber
            - red
            - unknown
        detail:
          type: string
        metrics:
          type: object
          additionalProperties: true
      required:
        - regime
        - status
        - detail
    ComplianceDashboard:
      type: object
      properties:
        tenant_id:
          type: string
          format: uuid
        overall:
          type: string
          enum:
            - green
            - amber
            - red
            - unknown
        promotional_window_open:
          type: boolean
        panes:
          type: array
          items:
            $ref: '#/components/schemas/CompliancePane'
        generated_at:
          type: string
          format: date-time
      required:
        - tenant_id
        - overall
        - promotional_window_open
        - panes
        - generated_at
    PreflightCheck:
      type: object
      properties:
        name:
          type: string
          example: dlt_template
        status:
          type: string
          enum:
            - green
            - red
            - unknown
        detail:
          type: string
      required:
        - name
        - status
        - detail
    PreflightResult:
      type: object
      properties:
        allowed:
          type: boolean
        checks:
          type: array
          items:
            $ref: '#/components/schemas/PreflightCheck'
      required:
        - allowed
        - checks
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          example: ok
      required:
        - status
    AnalyticsFunnel:
      type: object
      description: Aggregate delivery funnel totals for the tenant, counted by delivery-event type.
      properties:
        queued:
          type: integer
          format: int64
        sent:
          type: integer
          format: int64
        delivered:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        opened:
          type: integer
          format: int64
    ApiKey:
      type: object
      description: A stored API key. The raw secret is never returned after creation.
      required:
        - id
        - name
        - prefix
        - scope
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: First 16 chars of the raw key ("qn_live_" + 8 hex) — safe to display.
        scope:
          type: string
          enum:
            - full
            - read
            - send
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
    ApiKeyCreated:
      type: object
      description: Returned once on creation — the raw key is stored only as a SHA-256 hash and is never retrievable again.
      required:
        - id
        - key
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: Raw API key — shown ONCE. Store it securely; it cannot be recovered.
        prefix:
          type: string
        scope:
          type: string
          enum:
            - full
            - read
            - send
        warning:
          type: string
    AuditLog:
      type: object
      required:
        - id
        - actor_type
        - actor_id
        - action
        - resource_type
        - occurred_at
      properties:
        id:
          type: string
          format: uuid
        actor_type:
          type: string
          description: e.g. api_key or system.
        actor_id:
          type: string
          description: Actor identifier (e.g. apikey:<fingerprint>).
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
          nullable: true
        old_value:
          type: object
          additionalProperties: true
          nullable: true
        new_value:
          type: object
          additionalProperties: true
          nullable: true
        ip_address:
          type: string
          nullable: true
        occurred_at:
          type: string
          format: date-time
    Environment:
      type: object
      required:
        - id
        - slug
        - name
        - is_default
        - created_at
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
    EnvironmentChange:
      type: object
      description: A promotion/change-history entry recorded when a resource is promoted.
      required:
        - id
        - resource_type
        - resource_id
        - to_environment
        - action
        - created_at
      properties:
        id:
          type: string
          format: uuid
        resource_type:
          type: string
          enum:
            - template
            - workflow
        resource_id:
          type: string
          format: uuid
          description: The id of the resource copy created in the target environment.
        source_resource_id:
          type: string
          format: uuid
          nullable: true
        from_environment:
          type: string
          nullable: true
        to_environment:
          type: string
        action:
          type: string
        actor:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    BroadcastAudience:
      type: object
      description: Recipient selector. Empty = all active subscribers; external_ids targets a list; metadata targets a segment.
      properties:
        external_ids:
          type: array
          items:
            type: string
        metadata:
          type: object
          properties:
            key:
              type: string
            value:
              type: string
    BroadcastRequest:
      type: object
      required:
        - name
        - event
      properties:
        name:
          type: string
        event:
          type: string
          description: Trigger event fired for each recipient (matched against workflows).
        audience:
          $ref: '#/components/schemas/BroadcastAudience'
        payload:
          type: object
          additionalProperties: true
    Broadcast:
      type: object
      required:
        - id
        - name
        - event
        - status
        - sent_count
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        event:
          type: string
        audience:
          $ref: '#/components/schemas/BroadcastAudience'
        payload:
          type: object
          additionalProperties: true
        status:
          type: string
          enum:
            - draft
            - queued
            - running
            - completed
            - cancelled
        total_recipients:
          type: integer
          nullable: true
        sent_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EngagementRow:
      type: object
      description: Per-channel engagement rates and a 0–100 score (Module 28.1/28.2).
      properties:
        channel:
          type: string
        sent:
          type: integer
        delivered:
          type: integer
        opened:
          type: integer
        clicked:
          type: integer
        delivery_rate:
          type: number
          format: float
        open_rate:
          type: number
          format: float
        click_rate:
          type: number
          format: float
        engagement_score:
          type: integer
          description: 0–100 composite weighting clicks above opens.
    TemplateQuality:
      type: object
      description: Per-template composite quality score (Module 28.4).
      properties:
        template_id:
          type: string
          format: uuid
        sent:
          type: integer
        open_rate:
          type: number
          format: float
        click_rate:
          type: number
          format: float
        complaint_rate:
          type: number
          format: float
        quality_score:
          type: integer
          description: 0–100; 50 baseline plus open/click bonuses minus complaint/bounce penalties.
    UsageSummary:
      type: object
      description: Current calendar-month usage, plan, and quota assessment (Module 43.1/43.2).
      properties:
        period:
          type: object
          properties:
            start:
              type: string
              format: date-time
            label:
              type: string
              description: Calendar month, e.g. "2026-07".
        plan:
          $ref: '#/components/schemas/BillingPlan'
        usage:
          type: object
          properties:
            messages_total:
              type: integer
            workflow_runs:
              type: integer
            by_channel:
              type: object
              additionalProperties:
                type: integer
        quota:
          type: object
          properties:
            used:
              type: integer
            monthly_quota:
              type: integer
            status:
              type: string
              enum:
                - within
                - approaching
                - exceeded
            blocked:
              type: boolean
    BillingPlan:
      type: object
      properties:
        tier:
          type: string
          enum:
            - free
            - starter
            - growth
            - scale
            - enterprise
        monthly_quota:
          type: integer
          description: Billable messages included per month; 0 = unlimited.
        overage_allowed:
          type: boolean
    BatchingRule:
      type: object
      description: 'Send-pacing policy resolved most-specific-first: (channel, category) → (channel, all) → (all, category) → (all, all). Transactional/security sends bypass it.'
      required:
        - channel
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        channel:
          type: string
          enum:
            - email
            - sms
            - whatsapp
            - push
            - inapp
            - webhook
            - rcs
            - chatops
            - all
        category:
          type: string
          default: all
        max_per_period:
          type: integer
          nullable: true
          description: Frequency cap — max sends per subscriber per period (16.2).
        period_seconds:
          type: integer
          nullable: true
        cap_mode:
          type: string
          enum:
            - hard
            - soft
          default: hard
          description: hard = skip over-cap sends; soft = allow and log.
        throttle_per_second:
          type: integer
          nullable: true
          description: Per-tenant/channel send-rate ceiling; over-rate sends defer, never drop (16.3).
        digest_enabled:
          type: boolean
          default: false
        digest_window_secs:
          type: integer
          nullable: true
          description: Required when digest_enabled — the time window before a digest closes (16.1).
        digest_max_count:
          type: integer
          nullable: true
          description: Close the digest early once this many sends accumulate.
        digest_template_id:
          type: string
          format: uuid
          nullable: true
        is_active:
          type: boolean
          default: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Malformed request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Request conflicts with the current resource state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
