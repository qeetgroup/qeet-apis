              required:
                - name
                - threshold
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                connection_id:
                  type:
                    - string
                    - 'null'
                threshold:
                  type: integer
                  minimum: 1
                  maximum: 100
      responses:
        '201':
          description: Alert created
          content:
            application/json:
              schema:
                type: object
