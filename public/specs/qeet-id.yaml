      description: Requires connection.write. Maximum 50 rules per connection and one enabled rule per target. Rules apply to SCIM user writes and LDAP JIT provisioning. Profile data is tenant-scoped; groups are profile labels, not role or group membership grants. Email mapping affects creation, not existing account email addresses. Secret sources and privilege targets are rejected.
      tags:
        - Directory
      security:
        - Bearer-Token: []
        - API-Key: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: connectionID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectoryMapping'
      responses:
        '201':
          description: Mapping created and audited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryMapping'
        '400':
          description: Invalid source
          target: null
          type or transform: null
        '401':
          description: Authentication required
        '403':
          description: Tenant mismatch or missing connection.write
        '404':
          description: Connection not found in this tenant
        '409':
          description: Duplicate enabled target or rule limit reached
  /v1/tenants/{tenantID}/directory/connections/{connectionID}/mappings/{mappingID}:
    put:
      operationId: put_directory_connection_mapping
      summary: Update a versioned profile mapping
      description: Requires connection.write. The current version is required to prevent lost updates. Audited in the same transaction.
      tags:
        - Directory
      security:
        - Bearer-Token: []
        - API-Key: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: connectionID
          in: path
          required: true
          schema:
            type: string
        - name: mappingID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectoryMapping'
      responses:
        '200':
          description: Updated mapping and incremented version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryMapping'
        '400':
          description: Invalid mapping or missing version
        '401':
          description: Authentication required
        '403':
          description: Tenant mismatch or missing connection.write
        '404':
          description: Connection not found
        '409':
          description: Stale version
          missing mapping or duplicate enabled target: null
    delete:
      operationId: delete_directory_connection_mapping
      description: Deletes a single profile attribute-mapping rule from a directory connection, scoped to the tenant and connection in the path and requiring connection.write. The removal is audited in the same transaction, and subsequent SCIM writes and LDAP provisioning no longer apply the rule. Returns 404 when the mapping does not exist in this tenant and connection.
      summary: Delete a profile mapping
      tags:
        - Directory
      security:
        - Bearer-Token: []
        - API-Key: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: connectionID
          in: path
          required: true
          schema:
            type: string
        - name: mappingID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Mapping removed and audited
        '401':
          description: Authentication required
        '403':
          description: Tenant mismatch or missing connection.write
        '404':
          description: Mapping not found in this tenant and connection
  /v1/tenants/{tenantID}/directory/connections/{connectionID}/mappings/preview:
    post:
      operationId: post_directory_connection_mappings_preview
      summary: Preview the saved mappings with source data
      description: Requires connection.read. Uses the provisioning engine, without persisting the source or changing users. Source input is capped at 64 KiB.
      tags:
        - Directory
      security:
        - Bearer-Token: []
        - API-Key: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: connectionID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - source
              properties:
                source:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Transformed profile, per-rule preview values and validation issues
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  profile:
                    type: object
                    additionalProperties: true
                  values:
                    type: object
                    additionalProperties: true
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        mapping_id:
                          type: string
                          format: uuid
                        field:
                          type: string
                        message:
                          type: string
        '400':
          description: Invalid source JSON
        '401':
          description: Authentication required
        '403':
