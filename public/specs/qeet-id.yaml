        '404':
          $ref: '#/components/responses/NotFound'
  /v1/search:
    get:
      operationId: get_v1_search
      summary: Universal search
      description: Tenant-scoped, RBAC-enforced fuzzy search that fans out across user, organization, group, role, oidc_client, and audit_event resource types. Each type is gated behind its read permission (user.read, tenant.read, group.read, role.read, connection.read, audit.read); types the caller cannot read are silently excluded. Matching uses ILIKE '%q%' (parameterised). Results are scored and returned in descending relevance order. Pagination is cursor-based and opaque.
      tags:
        - Search
      parameters:
        - name: q
          in: query
          required: true
          description: Search query (1+ characters after trimming).
          schema:
            type: string
        - name: types
          in: query
          required: false
          description: 'Comma-separated list of resource types to search. Allowed values: user, organization, group, role, oidc_client, audit_event. Omit to search all permitted types.'
          schema:
            type: string
            example: user,group
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from a previous response's next_cursor field.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum results to return (1–50; default 20).
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      security:
        - Bearer-Token: []
        - API-Key: []
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
