    ABACPolicy:
      type: object
      description: One ABAC policy row.
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        effect:
          type: string
          enum:
            - allow
            - deny
        resource_type:
          type: string
          description: Resource type matched by this policy; '*' matches any.
        action:
          type: string
          description: Action matched by this policy; '*' matches any.
        condition:
          type: object
          description: 'Recursive JSON condition tree. An empty object {} means unconditional. Logical nodes: {"all":[...]}, {"any":[...]}, {"not": node}. Comparison leaf: {"attr":"subject.dept","op":"eq","value":"eng"}.'
          additionalProperties: true
        priority:
          type: integer
          description: Higher priority is evaluated first; deny wins at any priority.
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ABACPolicyCreate:
      type: object
      required:
        - name
        - effect
        - resource_type
        - action
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        effect:
          type: string
          enum:
            - allow
            - deny
        resource_type:
          type: string
          description: Resource type to match; '*' matches any resource type.
          minLength: 1
        action:
          type: string
          description: Action to match; '*' matches any action.
          minLength: 1
        condition:
          type: object
          description: Optional condition tree. Omit or send {} for unconditional.
          additionalProperties: true
        priority:
          type: integer
          default: 0
          description: Higher priority policies are evaluated first.
        enabled:
          type: boolean
          default: true
    ABACEvaluateRequest:
      type: object
      required:
        - action
