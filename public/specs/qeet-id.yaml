  /v1/tenants/{tenantID}/directory/connections:
    get:
      operationId: get_v1_tenants_ByTenantID_directory_connections
      summary: List directory connections
      description: Combines the tenant's configured SCIM endpoint and LDAP connections. Requires connection.read. Tenant scope is derived from the authenticated principal and must match the path. Credentials are never returned. Health is unknown until explicitly observed; last_activity_at is a request or login timestamp and is not evidence of a successful synchronization.
