          description: Directory connection inventory
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                        - reference
                        - type
                        - status
                        - health
                        - scope
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        reference:
                          type: string
                        type:
                          type: string
                          enum:
                            - scim
                            - ldap
                        status:
                          type: string
                          enum:
                            - configured
                            - active
                            - draft
                            - disabled
                        health:
                          type: string
                          enum:
                            - healthy
                            - warning
                            - failed
                            - unknown
                        environment:
                          type:
                            - string
                            - 'null'
                        scope:
                          type: string
                          enum:
                            - users-and-groups
                            - users-on-signin
                        created_at:
                          type:
                            - string
                            - 'null'
                          format: date-time
                        last_activity_at:
                          type:
                            - string
                            - 'null'
                          format: date-time
                        last_sync_at:
                          type:
                            - string
                            - 'null'
                          format: date-time
                        user_count:
                          type:
                            - integer
                            - 'null'
                          minimum: 0
                        group_count:
                          type:
                            - integer
                            - 'null'
                          minimum: 0
                        server_url:
                          type:
                            - string
                            - 'null'
        '400':
          description: Invalid tenant identifier
        '401':
          description: Authentication and tenant scope required
        '403':
          description: Tenant mismatch or missing connection.read permission
        '500':
