      responses:
        '200':
          description: '{ allowed: bool } by default; with explain=true, { allowed, path } where each path step is { object, relation, subject, depth }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                  path:
                    type: array
                    items:
                      type: object
                      properties:
                        object:
                          type: string
                        relation:
                          type: string
                        subject:
                          type: string
                        depth:
                          type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
