        '404':
          description: Connection not found
        '413':
          description: Source exceeds the supported size
  /v1/tenants/{tenantID}/directory/errors:
    get:
      operationId: get_v1_tenants_ByTenantID_directory_errors
      summary: List directory errors and remediation summary
      description: Requires connection.read. Only errors from the authenticated tenant are returned. Unknown affected-user counts are null, not inferred from request volume.
      tags:
        - Directory
      security:
        - Bearer-Token: []
        - API-Key: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
        - name: connection_id
          in: query
          schema:
            type: string
            maxLength: 128
        - name: severity
          in: query
          schema:
            type: string
            enum:
              - warning
              - critical
        - name: resolution
          in: query
          schema:
            type: string
            enum:
              - open
              - resolved
              - retried
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100000
      responses:
        '200':
          description: Error page, categories, affected connections, and latest remediations
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DirectoryEvent'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
                  summary:
                    type: object
                    properties:
                      open:
                        type: integer
                      critical:
                        type: integer
                      warning:
                        type: integer
                      retried:
                        type: integer
                      impacted_users:
                        type:
                          - integer
                          - 'null'
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        count:
                          type: integer
                  connections:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        count:
                          type: integer
                  remediations:
                    type: array
                    items:
                      $ref: '#/components/schemas/DirectoryEvent'
        '400':
          description: Invalid filters
        '401':
          description: Authentication required
        '403':
          description: Tenant mismatch or missing connection.read
  /v1/tenants/{tenantID}/directory/errors/{eventID}/resolve:
    post:
      operationId: post_v1_tenants_ByTenantID_directory_errors_ByEventID_resolve
      summary: Resolve a directory error
      description: Requires connection.write. Atomically closes an open error with an audit record. Does not retry its original operation.
      tags:
        - Directory
      security:
        - Bearer-Token: []
        - API-Key: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: eventID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Error resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  succeeded:
                    type: boolean
        '401':
          description: Authentication required
        '403':
          description: Tenant mismatch or missing connection.write
        '404':
          description: Error not found in this tenant
        '409':
          description: Error already closed
  /v1/tenants/{tenantID}/directory/errors/{eventID}/retry:
    post:
      operationId: post_v1_tenants_ByTenantID_directory_errors_ByEventID_retry
      summary: Retry a failed LDAP connection check
      description: Requires connection.write. Repeats only a failed manual LDAP bind check using current connection settings. SCIM pushes and sign-ins cannot be replayed because request bodies and credentials are never retained. Concurrent retries serialize and a successful retry closes the original error atomically with an audit record. Failed checks remain open.
      tags:
        - Directory
      security:
        - Bearer-Token: []
        - API-Key: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: eventID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Check completed; succeeded reports the actual outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  succeeded:
                    type: boolean
        '401':
          description: Authentication required
        '403':
          description: Tenant mismatch or missing connection.write
        '404':
          description: Error not found in this tenant
        '409':
          description: Operation cannot be retried or is already closed
  /v1/tenants/{tenantID}/directory/activity:
    get:
      operationId: get_v1_tenants_ByTenantID_directory_activity
      summary: List recorded directory operations
      description: Tenant-scoped SCIM writes and LDAP operations, newest first. Requires connection.read. Counts and durations describe observed operations, not provider scheduler jobs. Request bodies and credentials are never stored.
      tags:
        - Directory
      security:
        - Bearer-Token: []
        - API-Key: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
        - name: connection_id
          in: query
          schema:
            type: string
            maxLength: 128
        - name: status
          in: query
          schema:
            type: string
            enum:
              - success
              - warning
              - failed
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100000
      responses:
        '200':
          description: Operation page, filtered summary, and daily UTC volumes
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - limit
                  - offset
                  - summary
                  - volume
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DirectoryEvent'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
                  summary:
                    type: object
                    properties:
                      total:
                        type: integer
                      successful:
                        type: integer
                      warnings:
                        type: integer
                      failed:
                        type: integer
                      average_duration_ms:
                        type:
                          - integer
                          - 'null'
                  volume:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        users:
                          type: integer
                        groups:
                          type: integer
        '400':
          description: Invalid filters
        '401':
          description: Authentication required
        '403':
          description: Tenant mismatch or missing connection.read
  /v1/tenants/{tenantID}/directory/alerts:
