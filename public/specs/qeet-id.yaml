                token_type: Bearer
                expires_at: '2026-09-24T11:15:00Z'
                refresh_token: rt_1a2b3c4d5e6f70819a2b3c4d5e6f7081
                session_id: 018f2a72-7d8e-7f90-b123-4c5d6e7f8091
                user_id: 018f2a70-1a2b-7c3d-9e4f-5a6b7c8d9e0f
