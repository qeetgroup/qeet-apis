        - name: window
          in: query
          required: false
          description: Half-width of the same-actor correlation window in seconds (60–3600; default 300).
          schema:
            type: integer
            minimum: 60
            maximum: 3600
            default: 300
      security:
        - Bearer-Token: []
        - API-Key: []
