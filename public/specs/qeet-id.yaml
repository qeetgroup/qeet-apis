          description: Action matched by this policy; '*' matches any.
        condition:
          type: object
          description: 'Recursive JSON condition tree. An empty object {} means unconditional. Logical nodes: {"all":[...]}, {"any":[...]}, {"not": node}. Comparison leaf: {"attr":"subject.dept","op":"eq","value":"eng"}.'
