    EmailLocalizedContent:
      type: object
      description: Subject and preheader limits count Unicode characters. Text and HTML limits count UTF-8 bytes. Action URL variables must remain in both text and HTML when provided. Variables in URLs are allowed only as standalone action-link href values, never in image sources or within external URLs.
      required:
        - subject
        - body
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 150000
        preheader:
          type: string
          maxLength: 200
        body_html:
          type: string
          maxLength: 200000
    EmailTemplateOptions:
      type: object
      properties:
        preheader:
          type: string
          maxLength: 200
        body_html:
          type: string
          maxLength: 200000
        default_locale:
          type: string
          default: en
        show_logo:
          type: boolean
          default: true
        alignment:
          type: string
          enum:
            - left
            - center
          default: center
        translations:
          type: object
          maxProperties: 20
          description: Non-English BCP-47 language variants; English remains the base content.
          additionalProperties:
            $ref: '#/components/schemas/EmailLocalizedContent'
    EmailEditorInput:
      type: object
      description: Subject and preheader limits count Unicode characters. Text and HTML limits count UTF-8 bytes. Action URL variables must remain in both text and HTML when provided. Variables in URLs are allowed only as standalone action-link href values, never in image sources or within external URLs.
      required:
        - subject
        - body
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 150000
        options:
          $ref: '#/components/schemas/EmailTemplateOptions'
    EmailResolvedTemplate:
      allOf:
        - $ref: '#/components/schemas/EmailEditorInput'
        - type: object
          properties:
            key:
              type: string
            name:
              type: string
            description:
              type: string
            variables:
              type: array
              items:
                type: string
            custom:
              type: boolean
            delivery_scope:
              type: string
              enum:
                - tenant
                - platform
    ActivityActor:
      type: object
      description: The principal that caused an activity event.
      properties:
        id:
          type: string
          format: uuid
          description: Actor user UUID (absent for system/agent actors).
        name:
          type: string
          description: Display name when resolvable; omitted otherwise.
        type:
          type: string
          description: Actor type (e.g. "user", "system", "agent").
      required:
        - type
    ActivityTarget:
      type: object
      description: The resource the event acted upon.
      properties:
        type:
          type: string
          description: Resource type (e.g. "user", "group", "tenant").
        id:
          type: string
          format: uuid
          description: Resource UUID (omitted for un-keyed resources).
        label:
          type: string
          description: Human-readable resource label when available.
      required:
        - type
    ActivityEvent:
      type: object
      description: Unified representation of a domain event, derived from either the live NATS outbox stream or the durable audit log. Category and severity are computed from the event type and are never stored in the DB.
      required:
        - id
        - type
        - category
        - severity
        - title
        - at
      properties:
        id:
          type: string
          format: uuid
          description: For audit-log events this is the stable audit.events row UUID and is safe to use as Last-Event-ID for reconnect replay. For live NATS events a fresh UUID is generated per delivery.
        type:
          type: string
          description: Audit action string (e.g. "user.created", "auth.login.failed"). Dot-namespaced; first segment is the resource type.
          example: user.created
        category:
          type: string
          description: Coarse operational category derived from the event type prefix.
          enum:
            - authentication
            - authorization
            - security
            - directory
            - developer
            - system
        severity:
          type: string
          description: Derived severity level. critical — security incident (token reuse, threat detection); warning — failure or destructive operation; success — positive transition (create, enable, login); info — everything else.
          enum:
            - info
            - success
            - warning
            - error
            - critical
        title:
          type: string
          description: Human-readable title derived from the event type.
          example: User Created
        description:
          type: string
          description: Optional extended description.
        actor:
          $ref: '#/components/schemas/ActivityActor'
        target:
          $ref: '#/components/schemas/ActivityTarget'
        at:
          type: string
          format: date-time
          description: Event timestamp (UTC, RFC3339).
        source:
          type: string
          description: Event source identifier (e.g. service name).
        ip:
          type: string
          description: Requester IP address (dot-decimal or IPv6).
        location:
          type: string
          description: Best-effort geo location derived from IP (optional).
        device:
          type: string
          description: Device label parsed from user-agent (optional).
        browser:
          type: string
          description: Browser label parsed from user-agent (optional).
        status:
          type: string
          description: Application-level status carried in the event (optional).
        request_id:
          type: string
          description: Correlation ID of the originating request (optional). Shared by all audit events emitted while handling one request; drives the related-events correlation and is copyable in the console.
        metadata:
          type: object
          additionalProperties: true
          description: Domain-specific supplementary fields (non-normative).
    ActivityResponse:
      type: object
      description: Paginated activity history response.
      required:
        - events
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/ActivityEvent'
        next_cursor:
          type: string
          description: Opaque cursor for the next page. Present only when more results exist; omitted when this is the last page.
    ActivitySummaryResponse:
      type: object
      description: Aggregate counts over the same filter predicates as the history endpoint (types, actor, subject, from/to, q). severity/category filters are ignored — the endpoint produces that distribution. All bucket maps are zero-filled so the console renders a stable legend.
      required:
        - total
        - unique_actors
        - security_alerts
        - by_severity
        - by_category
        - by_outcome
        - series
        - bucket_seconds
        - window
      properties:
        total:
          type: integer
          format: int64
          description: Total events in the window.
        unique_actors:
          type: integer
          format: int64
          description: Distinct actor_user_id values in the window.
        security_alerts:
          type: integer
          format: int64
          description: Count of critical-severity events (threat.* and incidents).
        by_severity:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Event counts keyed by derived severity (all 5 keys present).
        by_category:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Event counts keyed by derived category (all 6 keys present).
        by_outcome:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: 'Event counts keyed by outcome: success, warning, failed, info.'
        series:
          type: array
          description: Time-bucketed counts for sparklines (empty buckets omitted). Each bucket carries the total plus per-outcome/severity breakdowns so the console can draw a distinct sparkline per metric card.
          items:
            type: object
            required:
              - at
              - count
              - success
              - warning
              - failed
              - info
              - critical
            properties:
              at:
                type: string
                format: date-time
                description: Bucket start (UTC, RFC3339).
              count:
                type: integer
                format: int64
                description: Total events in the bucket.
              success:
                type: integer
                format: int64
              warning:
                type: integer
                format: int64
              failed:
                type: integer
                format: int64
              info:
                type: integer
                format: int64
              critical:
                type: integer
                format: int64
        bucket_seconds:
          type: integer
          format: int64
          description: Width of each series bucket in seconds.
        window:
          type: object
          required:
            - from
            - to
          description: Resolved aggregation window (defaulted/clamped server-side).
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
    ActivityRelatedResponse:
      type: object
      description: The anchor event plus events correlated with it. by_request_id shares the anchor's request_id; by_actor is the same actor within a symmetric time window. An event never appears in both lists.
      required:
        - event
        - related
      properties:
        event:
          $ref: '#/components/schemas/ActivityEvent'
        related:
          type: object
          required:
            - by_request_id
            - by_actor
          properties:
            by_request_id:
              type: array
              items:
                $ref: '#/components/schemas/ActivityEvent'
            by_actor:
              type: array
              items:
                $ref: '#/components/schemas/ActivityEvent'
    SearchResult:
      type: object
      description: One item returned by the universal search endpoint.
      required:
        - type
        - id
        - title
        - subtitle
        - url
        - status
        - updated_at
        - score
        - metadata
      properties:
        type:
          type: string
          description: Resource type.
          enum:
            - user
            - organization
            - group
            - role
            - oidc_client
            - audit_event
        id:
          type: string
          format: uuid
        title:
          type: string
          description: Human-readable primary label (e.g. display name or resource name).
        subtitle:
          type: string
          description: Secondary label (e.g. email or slug).
        url:
          type: string
          description: Console deep-link for this resource.
        status:
          type: string
          description: Resource lifecycle status (e.g. "active", "suspended", "recorded").
        updated_at:
          type: string
          format: date-time
          description: Last-updated timestamp (uses created_at for immutable resources).
        score:
          type: number
          format: float
          description: 'Relevance score in [0.5, 1.0]: 1.0 = exact match, 0.75 = prefix match, 0.5 = substring match. Results are sorted desc by score.'
        metadata:
          type: object
          description: Type-specific supplementary fields (non-normative).
          additionalProperties: true
    SearchResponse:
      type: object
      description: Paginated search result envelope.
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        next_cursor:
          type: string
          description: Opaque cursor for the next page. Present only when more results exist; omitted (not null) when this is the last page.
    Qeet AIStatus:
      type: object
      description: AI qeetai configuration state. Never contains key material.
      properties:
        configured:
          type: boolean
          description: True when QEETAI_PROVIDER and QEETAI_API_KEY are set.
        provider:
          type: string
          description: Provider name (e.g. "anthropic"); empty when not configured.
        model:
          type: string
          description: Model identifier (e.g. "claude-sonnet-5"); empty when not configured.
    Qeet AIConversation:
      type: object
      description: A named qeetai conversation thread (tenant + user scoped).
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
        pinned:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Qeet AIMessage:
      type: object
      description: One turn in a qeetai conversation. `content` is an array of Anthropic content blocks (text / tool_use / tool_result) stored verbatim.
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - user
            - assistant
            - tool
        content:
          type: array
          description: Anthropic content-block array.
          items:
            type: object
            additionalProperties: true
        created_at:
          type: string
          format: date-time
    AuditAnomaly:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        actor_user_id:
          type: string
          format: uuid
          nullable: true
        actor_email:
          type: string
          nullable: true
        score:
          type: number
          description: 0..1 weighted-novelty anomaly score.
        reasons:
          type: array
          items:
            type: string
            enum:
              - new_action_type
              - unusual_hour
              - new_ip
        status:
          type: string
          enum:
            - open
            - resolved
        resolved_at:
          type: string
          format: date-time
          nullable: true
        resolved_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        action:
          type: string
        resource_type:
          type: string
        ip:
          type: string
          nullable: true
        event_at:
          type: string
          format: date-time
    AuditAnomalySettings:
      type: object
      properties:
        tenant_id:
          type: string
          format: uuid
        enabled:
          type: boolean
        score_threshold:
          type: number
          description: 0..1; an event scoring at or above this is flagged.
        min_baseline_events:
          type: integer
          description: Cold-start guard — an actor needs this many historical events before anything is flagged for them.
    RateLimitBucket:
      type: object
      description: A single token-bucket limit (rate tokens/sec, burst capacity).
      properties:
        rate:
          type: number
          description: Sustained tokens per second.
        capacity:
          type: integer
          description: Maximum burst capacity.
    TenantRateLimits:
      type: object
      description: Per-bucket rate limits for a tenant. On GET these are the effective values (defaults merged with overrides); on PUT, any bucket supplied is upserted as an override.
      properties:
        tenant:
          $ref: '#/components/schemas/RateLimitBucket'
        user:
          $ref: '#/components/schemas/RateLimitBucket'
        api_key:
          $ref: '#/components/schemas/RateLimitBucket'
    EvidenceControlResult:
      type: object
      description: Outcome of a single compliance control check against live system state.
      properties:
        id:
          type: string
          description: Unique control identifier within the framework (e.g. CC6.1-MFA).
        name:
          type: string
        category:
          type: string
        criteria:
          type: string
          description: Framework reference code (e.g. CC6.1 or A.9.4).
        status:
          type: string
          enum:
            - pass
            - fail
            - na
          description: pass — condition positively confirmed; fail — condition not met; na — data not determinable (never a fabricated pass).
        detail:
          type: string
          description: Human-readable explanation of what was found; always populated.
    EvidenceRun:
      type: object
      description: Immutable snapshot of one compliance evidence generation pass for a tenant+framework pair. Controls are populated on GetRun; omitted on ListRuns.
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        framework:
          type: string
          enum:
            - soc2
            - iso27001
        generated_at:
          type: string
          format: date-time
        generated_by:
          type: string
          format: uuid
          nullable: true
          description: Actor user ID; null when generated by a system or API-key actor.
        pass_count:
          type: integer
        fail_count:
          type: integer
        na_count:
          type: integer
        controls:
          type: array
          description: Per-control results; present on GetRun, omitted on ListRuns.
          items:
            $ref: '#/components/schemas/EvidenceControlResult'
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
      description: Maximum items to return.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque pagination cursor from a prior response's next_cursor.
