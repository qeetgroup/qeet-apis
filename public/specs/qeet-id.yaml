    put:
      operationId: put_v1_qeetai_provider_config
      description: Stores the tenant's own AI provider credentials so the assistant runs against the tenant's key rather than the platform fallback, which unlocks it regardless of plan. Secrets are encrypted at rest and are never returned in full by the read endpoint. Restricted to organization administrators; validate the credentials with the test operation before saving.
      summary: Store tenant AI provider configuration
      tags:
        - Qeet AI
      security:
        - Bearer-Token: []
        - API-Key: []
      requestBody:
        required: true
        content:
