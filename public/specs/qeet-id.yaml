  /v1/mfa/push/devices:
    get:
      operationId: get_v1_mfa_push_devices
      description: Lists the caller's registered push-approval devices used as a second factor, each with its label and platform, for management in account security settings. It never returns the secret device token, which is shown only once at registration. Add or rotate a device with the register-device call and remove one with the revoke-device call.
      summary: List registered push-MFA devices
      tags:
        - MFA
      security:
        - Bearer-Token: []
        - API-Key: []
      responses:
        '200':
          description: Registered devices
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: post_v1_mfa_push_devices
      description: Registers a mobile device for push-based MFA, or rotates the credential of an existing one, from its platform push token. The resulting device token is returned only in this response and cannot be retrieved later, so the device must persist it to answer future challenges. That token is required when responding to a challenge; revoke the device with the corresponding delete call.
      summary: Register or rotate a push-MFA device
      tags:
        - MFA
      security:
        - Bearer-Token: []
        - API-Key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - push_token
                - platform
              properties:
                name:
                  type: string
                push_token:
                  type: string
                platform:
                  type: string
                  enum:
                    - ios
                    - android
      responses:
        '201':
          description: Device registered; device_token is returned once
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/mfa/push/devices/{id}:
    delete:
      operationId: delete_v1_mfa_push_devices_ById
      description: Revokes a registered push-MFA device by its identifier so it can no longer approve challenges. Its device token is invalidated immediately and any pending challenge to it can no longer be answered. Re-enroll the device with the register-device call if push approval is needed again.
      summary: Revoke a push-MFA device
      tags:
        - MFA
      security:
        - Bearer-Token: []
        - API-Key: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Device revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/mfa/push/challenges/{id}:
    get:
      operationId: get_v1_mfa_push_challenges_ById
      description: Returns the current status of a push-MFA challenge, letting the sign-in surface poll while it waits for the user to approve or deny on their device. It is unauthenticated because it is called before the second factor is satisfied, and it exposes only the challenge state, not user data. The enrolled device answers the challenge through the challenge-respond call.
      summary: Poll a push-MFA challenge
      tags:
        - MFA
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Challenge status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/mfa/push/challenges/{id}/respond:
    post:
      operationId: post_v1_mfa_push_challenges_ById_respond
      description: Records the user's approval or denial of a push-MFA challenge, called by the enrolled device rather than the browser. It is authenticated by the device_token issued at registration together with the matching user_id, not a session credential, which is why no bearer token is required. Once recorded, the polling sign-in surface observes the outcome through the challenge-status call and proceeds or fails accordingly.
      summary: Approve or deny a push-MFA challenge
      tags:
        - MFA
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - device_token
                - approved
              properties:
                user_id:
                  type: string
                  format: uuid
                device_token:
                  type: string
                approved:
                  type: boolean
      responses:
        '204':
          description: Challenge response recorded
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/check:
    get:
      operationId: get_v1_check
      description: Evaluates whether a user holds a given permission in a tenant under the baseline RBAC model and returns an allow or deny decision. By default the response is the bare decision; pass explain=true to receive the full authorization trace, including the grant path and, on denial, a reason. This is a read-only decision and changes no state. Richer models are available through the ABAC evaluate, ReBAC check, and AuthZEN evaluation calls.
      summary: Permission check
      tags:
        - RBAC
      parameters:
        - in: query
          name: user_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: permission
          required: true
          schema:
            type: string
        - in: query
          name: explain
          required: false
          description: When "true", return the full authorization trace (allowed, the grant path(s), and a reason on denial) instead of the bare {allowed} object.
          schema:
            type: string
            enum:
              - 'true'
      security:
        - Bearer-Token: []
        - API-Key: []
      responses:
        '200':
          description: Decision. The default shape is {allowed}. With explain=true the response is the Explanation object (allowed, paths, reason).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      allowed:
                        type: boolean
                  - $ref: '#/components/schemas/AuthzExplanation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/permissions:
    get:
      operationId: get_v1_permissions
      description: Returns the catalog of permissions defined in the system that can be granted to roles under RBAC. Use it to populate role-editing surfaces and to discover the permission keys accepted by the permission-check call. The list is a reference catalog and reflects no particular user's grants.
