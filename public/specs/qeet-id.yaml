    post:
      operationId: post_v1_oauth_bc_authorize
      summary: Backchannel authentication (CIBA, poll mode)
      description: OpenID CIBA §7. Client-authenticated endpoint for a client that already knows who the user is (login_hint, an email scoped to the client's tenant) — no browser redirect. Best-effort notifies the user (in-app), then returns auth_req_id; the client polls /v1/oauth/token-code with grant_type=urn:openid:params:grant-type:ciba while the user approves/denies via GET/POST /v1/oauth/bc-authorize/{pending,decision}.
      tags:
        - OIDC
      security:
        - OAuth2-Client-Credentials: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - client_id
                - login_hint
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                login_hint:
                  type: string
                  format: email
                scope:
                  type: string
                binding_message:
                  type: string
                  description: Shown to the user in the consent notification (e.g. a transaction reference).
      responses:
        '200':
          description: Backchannel authentication response
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth_req_id:
                    type: string
                  expires_in:
                    type: integer
                  interval:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
