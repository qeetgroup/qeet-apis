  /v1/qeetai/conversations/{conversationID}/messages:
    post:
      operationId: post_v1_qeetai_conversations_ByConversationID_messages
      summary: Send a message / continue with tool results (SSE stream)
      description: |-
        Opens a streaming turn of the AI qeetai conversation. The response is a `text/event-stream` of SSE frames (thinking, token, tool_call, tool_result, error, done). Each frame is `event: <type>\ndata: <json>\n\n`.

        On `stop_reason=tool_use` the stream ends with `done{reason:"tool_use"}`; the browser executes the tool under its own bearer token and posts `tool_results` to this same endpoint to continue generation.

        Requires `QEETAI_PROVIDER` configured server-side; returns `409 qeetai_unconfigured` otherwise.
      tags:
        - Qeet AI
      parameters:
        - name: conversationID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - Bearer-Token: []
        - API-Key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: User text input for this turn (mutually exclusive with tool_results).
                tool_results:
                  type: array
                  description: Tool execution results from the previous turn (continuation after client-side tool execution). Mutually exclusive with message.
                  items:
                    type: object
                    properties:
                      tool_call_id:
                        type: string
                      name:
                        type: string
                      output:
                        type: object
                        additionalProperties: true
                      error:
                        type: object
                        properties:
                          code:
                            type: string
                          message:
                            type: string
                context:
                  type: object
                  description: Console context for grounding (current route, selection). Treated as untrusted; never used for authorization.
                  additionalProperties: true
      responses:
        '200':
          description: 'SSE stream of StreamEvent frames. Event types: thinking, token, tool_call, tool_result, error, done.'
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Qeet AI not configured (QEETAI_PROVIDER/QEETAI_API_KEY unset)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
