      operationId: post_v1_tenants_ByTenantID_directory_alerts
      summary: Create a directory failure alert
      description: Requires connection.write and a user principal. Creates an in-app alert for the caller when the failure threshold is reached within 15 minutes. Notifications are rate limited to once per alert per 15 minutes.
