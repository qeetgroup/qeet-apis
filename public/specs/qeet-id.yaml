    get:
      operationId: get_v1_tenants_ByTenantID_admin_portal_links
      description: Lists the admin-portal links a tenant admin has generated for external IT admins, returning metadata only; the raw link token is shown just once at generation and is never returned again. Generate a link with POST to this path and revoke one with the delete endpoint.
      summary: List admin portal links
      tags:
        - Admin Portal
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
      security:
        - Bearer-Token: []
        - API-Key: []
      responses:
        '200':
          description: Links (metadata only — the raw token is never returned again after generation)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminPortalLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: post_v1_tenants_ByTenantID_admin_portal_links
      summary: Generate an admin portal link
      description: Mints a one-time link an external IT admin (no Qeet ID account) can exchange for a short-lived portal session, scoped to the given capabilities and expiring after ttl_seconds (clamped 15m-24h, default 1h). The raw token/url is returned exactly once; the URL carries the token only in its fragment.
      tags:
        - Admin Portal
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
      security:
        - Bearer-Token: []
        - API-Key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - capabilities
              properties:
                capabilities:
                  type: array
                  items:
                    type: string
                    enum:
                      - saml
                      - scim
                ttl_seconds:
                  type: integer
      responses:
        '201':
          description: Link generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  link:
                    $ref: '#/components/schemas/AdminPortalLink'
                  token:
                    type: string
                    description: The raw token — shown only here. Not recoverable afterward.
                  url:
                    type: string
                    format: uri
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
