  /v1/users/suspended:
    get:
      operationId: get_v1_users_suspended
      summary: List suspended users and review metrics
      description: Requires user.read. Tenant scope comes only from the authenticated principal. Includes owned accounts and tenant members; private suspension metadata is masked for accounts owned elsewhere, with can_manage=false. Historical unknown timestamps and risk are not inferred.
      tags:
        - Users
      security:
        - Bearer-Token: []
        - API-Key: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: reason
          in: query
          schema:
            type: string
        - name: source
          in: query
          schema:
            type: string
        - name: team
          in: query
          schema:
            type: string
            maxLength: 200
        - name: risk
          in: query
          schema:
            type: string
            enum:
              - unknown
              - low
              - medium
              - high
        - name: review
          in: query
          schema:
            type: string
            enum:
              - pending
              - reviewed
              - external
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100000
      responses:
        '200':
          description: Suspended users with scoped summary, reason/risk breakdowns and review queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SuspendedDirectoryUser'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
                  summary:
                    type: object
                    properties:
                      total:
                        type: integer
                      high_risk:
                        type: integer
                      policy:
                        type: integer
                      manual:
                        type: integer
                      pending:
                        type: integer
                  reasons:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        count:
                          type: integer
                  risks:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        count:
                          type: integer
                  queue:
                    type: array
                    items:
                      $ref: '#/components/schemas/SuspendedDirectoryUser'
                  teams:
                    type: array
                    items:
                      type: string
        '400':
          description: Invalid filters
        '401':
          description: Authentication and tenant required
        '403':
          description: Missing user.read
  /v1/users/{id}/reactivate:
    post:
      operationId: post_v1_users_ById_reactivate
      summary: Reactivate a suspended owned user
      description: Requires user.write and ownership in the active tenant. Revokes existing sessions and records audit/outbox evidence atomically; old sessions are never restored.
      tags:
        - Users
      security:
        - Bearer-Token: []
        - API-Key: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User reactivated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Authentication required
        '403':
          description: Missing user.write
        '404':
          description: Account not owned by this tenant
        '409':
          description: Account is no longer suspended
  /v1/users/{id}/suspension:
    put:
      operationId: put_v1_users_ById_suspension
      summary: Review a suspended owned user
      description: Requires user.write and ownership. Updates review facts and emits audit/outbox evidence without reactivating the account.
      tags:
        - Users
      security:
        - Bearer-Token: []
        - API-Key: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
                - risk
                - review
              properties:
                reason:
                  type: string
                  enum:
                    - unspecified
                    - provider
                    - suspicious_activity
                    - policy_violation
                    - account_compromise
                    - offboarding
                    - inactive
                    - other
                risk:
                  type: string
                  enum:
                    - unknown
                    - low
                    - medium
                    - high
                review:
                  type: string
                  enum:
                    - pending
                    - reviewed
      responses:
        '204':
          description: Review saved
        '400':
          description: Invalid review facts
        '401':
          description: Authentication required
        '403':
          description: Missing user.write
        '404':
          description: Account not owned by this tenant
        '409':
          description: Account is no longer suspended
