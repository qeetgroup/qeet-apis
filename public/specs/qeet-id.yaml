          description: Anchor event UUID (audit.events row id).
          schema:
            type: string
            format: uuid
        - name: window
          in: query
          required: false
          description: Half-width of the same-actor correlation window in seconds (60–3600; default 300).
          schema:
            type: integer
            minimum: 60
            maximum: 3600
            default: 300
      security:
        - Bearer-Token: []
        - API-Key: []
      responses:
        '200':
          description: Anchor event and correlated events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityRelatedResponse'
        '400':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
