    delete:
      operationId: delete_v1_qeetai_provider_config
      description: Removes the tenant's bring-your-own-key AI provider configuration, reverting to the deployment's platform fallback where one is available. Restricted to organization administrators. Once removed, assistant availability again depends on the tenant's plan.
