      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - capabilities
              properties:
                capabilities:
                  type: array
                  items:
                    type: string
                    enum:
                      - saml
                      - scim
                ttl_seconds:
                  type: integer
      responses:
        '201':
          description: Link generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  link:
                    $ref: '#/components/schemas/AdminPortalLink'
                  token:
                    type: string
                    description: The raw token — shown only here. Not recoverable afterward.
                  url:
                    type: string
                    format: uri
