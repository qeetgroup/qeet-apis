      operationId: post_v1_tenants_ByTenantID_domains
      description: Registers a domain for the tenant and returns the DNS TXT record that must be published to prove ownership. The record lives under a dedicated verification subdomain so it does not disturb existing apex TXT records such as SPF. Publish the returned record in DNS, then call the verify-domain endpoint to complete the claim.
