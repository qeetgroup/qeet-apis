      operationId: get_v1_search
      summary: Universal search
      description: Tenant-scoped, RBAC-enforced fuzzy search that fans out across user, organization, group, role, oidc_client, and audit_event resource types. Each type is gated behind its read permission (user.read, tenant.read, group.read, role.read, connection.read, audit.read); types the caller cannot read are silently excluded. Matching uses ILIKE '%q%' (parameterised). Results are scored and returned in descending relevance order. Pagination is cursor-based and opaque.
      tags:
        - Search
      parameters:
        - name: q
          in: query
          required: true
          description: Search query (1+ characters after trimming).
          schema:
            type: string
        - name: types
          in: query
          required: false
          description: 'Comma-separated list of resource types to search. Allowed values: user, organization, group, role, oidc_client, audit_event. Omit to search all permitted types.'
          schema:
            type: string
            example: user,group
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from a previous response's next_cursor field.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum results to return (1–50; default 20).
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      security:
        - Bearer-Token: []
        - API-Key: []
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/tenants/{tenantID}/audit:
    get:
      operationId: get_v1_tenants_ByTenantID_audit
      description: Returns the tenant's audit events in reverse chronological order with cursor-based pagination and optional filters for action, resource type, actor, and a free-text query. The audit log is append-only and hash-chained, so results reflect an immutable record of activity. Pass the returned cursor to page through history; access is restricted to the tenant named in the path.
      summary: List audit events
      tags:
        - Audit
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: |
            Free-text search over action, resource_type, actor_type, user_agent, and metadata. Evaluated as a PostgreSQL websearch_to_tsquery expression — supports quoted phrases ("failed login"), exclusions (-saml), and OR.
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: resource_type
          in: query
          required: false
          schema:
            type: string
        - name: actor_user_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 50; the server clamps values above 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: The id of the last-seen event, for keyset pagination.
          schema:
            type: string
      security:
        - Bearer-Token: []
        - API-Key: []
      responses:
        '200':
          description: '{ items: AuditEvent[], next_cursor: string }'
          content:
            application/json:
              example:
                events:
                  - id: 018f2a90-1b2c-7d3e-8f40-5a6b7c8d9e01
                    action: user.created
                    resource_type: user
                    resource_id: 018f2a70-1a2b-7c3d-9e4f-5a6b7c8d9e0f
                    actor_user_id: 018f2a70-1a2b-7c3d-9e4f-5a6b7c8d9e0f
                    created_at: '2026-09-24T10:15:04Z'
                  - id: 018f2a90-0a1b-7c2d-8e3f-4a5b6c7d8e00
                    action: tenant.created
                    resource_type: tenant
                    resource_id: 018f2a6c-9c3d-7e4a-b2f1-3a5c9d8e1f00
                    actor_user_id: 018f2a70-1a2b-7c3d-9e4f-5a6b7c8d9e0f
                    created_at: '2026-09-24T10:15:00Z'
                next_cursor: 018f2a90-0a1b-7c2d-8e3f-4a5b6c7d8e00
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/audit/verify:
    get:
      operationId: get_v1_audit_verify
      summary: Verify platform audit chain (public)
      description: Verifies the platform-level audit hash chain (the rows with no tenant) and returns only whether the chain is intact and how many rows were checked. Unauthenticated by design so any external party can independently confirm the platform has not tampered with its audit log; per-tenant verification is at /v1/tenants/{tenantID}/audit/verify and requires auth.
