  /healthz:
    get:
      operationId: get_healthz
      description: Returns 200 whenever the process can answer the request, reporting only that the instance is running rather than that its dependencies are reachable. Requires no authentication and performs no dependency checks, making it the cheapest way to confirm connectivity. Container orchestrators use this signal to decide whether to restart the instance.
      summary: Liveness
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /metrics:
    get:
      operationId: get_metrics
      description: Exposes process and request metrics in Prometheus exposition format for scraping by a metrics collector. Requires no authentication and is intended to be reached only from within the deployment network. The payload reflects the instance's current counters and gauges at the time of the call.
      summary: Metrics (Prometheus)
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Prometheus exposition format
          content:
            text/plain:
              schema:
                type: string
  /readyz:
    get:
      operationId: get_readyz
      description: Runs every registered dependency probe under a short shared timeout and returns 200 only when all pass, otherwise 503 with a per-check breakdown. Requires no authentication. Unlike the liveness probe, a failure here indicates the instance is temporarily unable to serve traffic, so orchestrators route requests away without restarting the process.
      summary: Readiness
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '503':
          description: Not ready (a dependency is down)
  /v1/activity:
    get:
      operationId: get_v1_activity
      summary: Activity history
      description: Returns a cursor-paginated list of ActivityEvent derived from the tenant-scoped audit log. Severity and category are computed from the event type and applied post-fetch. Tenant is derived from the JWT principal only — never from URL or body.
      tags:
        - Activity
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from a previous response next_cursor field. Encodes the ID of the last seen event.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum events to return (1–200; default 50).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: types
          in: query
          required: false
          description: Comma-separated list of exact event types (audit action values, e.g. "user.created,user.deleted"). Omit to return all types.
          schema:
            type: string
            example: user.created,user.deleted
        - name: severity
          in: query
          required: false
          description: Minimum severity level. Events below this level are excluded. Severity is derived from the event type, not stored in the DB.
          schema:
            type: string
            enum:
              - info
              - success
              - warning
              - error
              - critical
        - name: category
          in: query
          required: false
          description: Filter by event category (authentication, authorization, security, directory, developer, system). Derived from the event type prefix.
          schema:
            type: string
            enum:
              - authentication
              - authorization
              - security
              - directory
              - developer
              - system
        - name: actor
          in: query
          required: false
          description: Filter by actor user UUID.
          schema:
            type: string
            format: uuid
        - name: subject
          in: query
          required: false
          description: Identity timeline filter. When set, returns every event where the given user UUID is either the actor OR the target of a 'user' resource event. Omit to return events for all subjects.
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: Free-text search over action, resource_type, actor_type, user_agent, and metadata. Evaluated as a PostgreSQL websearch_to_tsquery expression — supports quoted phrases, exclusions (-saml), and OR.
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Inclusive lower bound on event timestamp (RFC3339).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Inclusive upper bound on event timestamp (RFC3339).
          schema:
            type: string
            format: date-time
      security:
        - Bearer-Token: []
        - API-Key: []
      responses:
        '200':
          description: Paginated activity events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
        '400':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/activity/stream:
    get:
      operationId: get_v1_activity_stream
      summary: Live activity stream (SSE)
      description: |-
        Opens a Server-Sent Events stream of ActivityEvent frames for the caller's tenant. Each frame is `event: activity\ndata: <json>\n\n`; periodic `: keep-alive` comments prevent proxy timeouts.

        When `Last-Event-ID` is supplied the server replays up to 100 audit events newer than that ID (chronological order) before switching to the live stream, covering reconnect gaps.

        Server-side filters (`?types`, `?severity`, `?category`) are applied to both the replay and the live stream. The connection tenant is derived from the JWT principal only — never from the URL or body.

        The write deadline is extended to 1 hour. Set `X-Accel-Buffering: no` is already set by the server (Nginx/Caddy proxy buffering disabled).
      tags:
        - Activity
      parameters:
        - name: types
          in: query
          required: false
          description: Comma-separated event type prefixes to match (e.g. "user,auth"). An event matches if its type equals or starts with any listed value.
          schema:
            type: string
        - name: severity
          in: query
          required: false
          description: Minimum severity level to stream.
          schema:
            type: string
            enum:
              - info
              - success
              - warning
              - error
              - critical
        - name: category
          in: query
          required: false
          description: Exact category to stream; omit for all.
          schema:
            type: string
            enum:
              - authentication
              - authorization
              - security
              - directory
              - developer
              - system
      security:
        - Bearer-Token: []
        - API-Key: []
      responses:
        '200':
          description: 'SSE stream of ActivityEvent frames. Event name: "activity". Periodic "`: keep-alive`" comments maintain the connection.'
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/activity/summary:
    get:
      operationId: get_v1_activity_summary
      summary: Activity summary
      description: Aggregate counts over the same filter predicates as the history endpoint (types, actor, subject, from/to, q). The severity and category filters are ignored — this endpoint produces that distribution. Without an explicit `from` the window defaults to the last 24h and is hard-capped at 90 days to bound the per-tenant scan. Tenant is derived from the JWT principal only.
      tags:
        - Activity
      parameters:
        - name: types
          in: query
          required: false
          description: Comma-separated exact event types (audit action values).
          schema:
            type: string
        - name: actor
          in: query
          required: false
          description: Filter by actor user UUID.
          schema:
            type: string
            format: uuid
        - name: subject
          in: query
          required: false
          description: Identity-timeline filter (actor OR user-resource target).
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: Free-text search (websearch_to_tsquery).
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Inclusive lower bound (RFC3339); defaults to now-24h.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Inclusive upper bound (RFC3339); defaults to now.
          schema:
            type: string
            format: date-time
        - name: bucket
          in: query
          required: false
          description: Sparkline bucket width in seconds (60–86400). Omit to auto-size to ~48 buckets across the window.
          schema:
            type: integer
            minimum: 60
            maximum: 86400
      security:
        - Bearer-Token: []
        - API-Key: []
      responses:
        '200':
          description: Aggregate activity summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitySummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/activity/{id}/related:
    get:
      operationId: get_v1_activity_ByID_related
      summary: Related activity events
      description: Returns the anchor event plus events correlated with it by request_id and by the same actor within a symmetric time window. The anchor lookup is tenant-scoped — an unknown id or a foreign tenant's id both return 404. An event never appears in both correlation lists.
