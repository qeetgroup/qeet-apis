name: close public window (safety net)

# Re-privatizes this repository if it is ever found public.
#
# `deploy-public-window.yml` closes its own window with `if: always()`, which
# covers a failed or cancelled deploy. It does NOT cover the runner being
# killed outright — a cancelled workflow, a spot-instance eviction, a GitHub
# Actions incident — because then no cleanup step runs at all and the repo just
# stays public.
#
# This workflow is that backstop. It is cheap (one API call) and it is the
# difference between a window measured in seconds and one measured in however
# long it takes a human to notice.
#
# It runs on a schedule and can be triggered by hand. If you ever *intend* to
# make this repository public, disable this workflow first — it will otherwise
# quietly undo you.
#
# Requires the same `REPO_ADMIN_TOKEN` secret as the deploy workflow
# (fine-grained PAT, "Administration: read and write" on this repo).

on:
  schedule:
    # Every 10 minutes. GitHub may delay scheduled runs under load, so treat
    # this as a bound on exposure, not a guarantee.
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: close-public-window
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-privatize if public
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          private=$(gh api "repos/${REPO}" --jq '.private')
          if [ "$private" = "true" ]; then
            echo "repository is private — nothing to do"
            exit 0
          fi

          # Do not fight a deploy that is still mid-window: that workflow holds
          # the `deploy-public-window` concurrency group, and re-privatizing
          # underneath it would break the Vercel clone.
          running=$(gh api \
            "repos/${REPO}/actions/runs?status=in_progress&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "deploy (public window)")] | length')

          if [ "$running" != "0" ]; then
            echo "::notice::Repository is public but a deploy is in progress — leaving it alone."
            exit 0
          fi

          echo "::warning::Repository is PUBLIC with no deploy running. Re-privatizing."
          gh api -X PATCH "repos/${REPO}" -F private=true >/dev/null

          confirm=$(gh api "repos/${REPO}" --jq '.private')
          if [ "$confirm" != "true" ]; then
            echo "::error::Failed to re-privatize ${REPO}. Do it by hand immediately."
            exit 1
          fi
          echo "re-privatized ${REPO}"
