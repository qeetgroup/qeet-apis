name: deploy

# Same shape as qeet-id-website / qeet-id-server / qeet-id-console: every merge
# to main gates, deploys, then tags. The tag is pushed only after Vercel reports
# success, so a tag always corresponds to a version that is actually live and a
# failed deploy leaves no tag behind.
#
# Tagging last also avoids a trap: GitHub raises no workflow events for anything
# done with the default GITHUB_TOKEN, so a tag pushed by a workflow cannot
# trigger a separate `on: push: tags` deploy — it would silently never run.
#
# ── Required configuration ────────────────────────────────────────────────
# Settings → Secrets and variables → Actions
#
#   Secret    VERCEL_TOKEN       Vercel → Account Settings → Tokens, scoped to
#                                the "Qeet Group" team
#   Variable  VERCEL_ORG_ID      from `vercel link` (.vercel/project.json)
#   Variable  VERCEL_PROJECT_ID  same file
#
# The CLI builds here and uploads the finished output, so it never clones the
# repository — which is why this works regardless of the repo's visibility, and
# why the deployment is pinned to this exact commit rather than to whatever sits
# at the head of a branch.

on:
  push:
    branches: [main] # every merge to main gates, deploys, then tags
  workflow_dispatch:
    inputs:
      bump:
        description: Which version part to increment
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # push the version tag after a successful deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://api.qeet.in
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      # First, and before any setup: a missing secret otherwise surfaces ~30s
      # in as Vercel's "You defined --token, but it's missing a value", which
      # does not say which secret is missing or where to add it.
      - name: Check Vercel configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${VERCEL_TOKEN:-}"      ] || missing+=("secret VERCEL_TOKEN")
          [ -n "${VERCEL_ORG_ID:-}"     ] || missing+=("variable VERCEL_ORG_ID")
          [ -n "${VERCEL_PROJECT_ID:-}" ] || missing+=("variable VERCEL_PROJECT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing $(IFS=', '; echo "${missing[*]}"). Add them under Settings → Secrets and variables → Actions. VERCEL_TOKEN comes from Vercel → Account Settings → Tokens, scoped to the Qeet Group team."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history to find the latest tag

      - name: Determine next version
        id: version
        env:
          # `type: choice` constrains this server-side, but keep it out of the
          # script body anyway so the run block never interpolates input.
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          # --sort=-version:refname orders numerically, so v0.0.10 comes after
          # v0.0.9 rather than sorting before it.
          latest=$(git tag --list 'v*' --sort=-version:refname | head -1)
          latest=${latest:-v0.0.0}
          IFS='.' read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            major) new_tag="v$((major + 1)).0.0" ;;
            minor) new_tag="v${major}.$((minor + 1)).0" ;;
            *)     new_tag="v${major}.${minor}.$((patch + 1))" ;;
          esac
          echo "Latest: $latest  ->  new: $new_tag"
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fast gate: don't ship code that fails spec validation, typecheck, lint
      # or unit tests. Structural spec errors fail here; documentation-quality
      # gaps only report (see scripts/validate-specs.mjs — Qeet Pay's missing
      # prose is upstream debt tracked in qeet-pay-server).
      - name: Validate OpenAPI specs
        run: bun run validate:specs

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (Biome)
        run: bun run lint

      - name: Unit tests
        run: bun test

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      # Runs `installCommand` + `buildCommand` from vercel.json (both bun), and
      # @astrojs/vercel emits the Build Output API to .vercel/output. The CLI
      # sets VERCEL=1, which is what makes the built portal call APIs directly
      # instead of through its server-side proxy — see src/config/scalar.ts.
      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

      # Tag + release AFTER a successful deploy so every tag == a live deployed
      # version. Matches qeet-id-website / qeet-id-server deploy.yml.
      - name: Push version tag and create GitHub release
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --repo "${{ github.repository }}"
