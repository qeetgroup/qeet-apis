name: deploy

# Deploys the developer portal to Vercel through the Vercel CLI rather than
# Vercel's Git integration.
#
# ── Why the CLI, not the Git integration ───────────────────────────────────
# Vercel's Hobby plan cannot connect to a private *organization* repository.
# This workflow sidesteps that entirely: Vercel is never linked to GitHub. The
# Action checks the code out, builds it, and uploads the finished output. The
# repository stays private the whole time.
#
# That also means the repo must NOT be flipped public to deploy. Making a
# public repo private again does not undo the exposure — GitHub splits existing
# public forks into a separate network, so any fork taken during the window
# stays public forever, and public push events are archived within seconds.
#
# ── Required configuration ─────────────────────────────────────────────────
# Repository → Settings → Secrets and variables → Actions
#
#   Secret    VERCEL_TOKEN        Account Settings → Tokens (scope it to the
#                                 team that owns this project)
#   Variable  VERCEL_ORG_ID       from .vercel/project.json after `vercel link`
#   Variable  VERCEL_PROJECT_ID   same file
#
# Get the two ids once, locally:
#   npx vercel link          # creates .vercel/project.json (gitignored)
#   cat .vercel/project.json
#
# ── A note on plans ────────────────────────────────────────────────────────
# Hobby is licensed for non-commercial use. This route is the right fix for the
# private-repo restriction, but a company portal on a paid plan is the
# straightforward answer if the account is ever reviewed.

# Manual only. `deploy-public-window.yml` is the workflow wired to `push`, by
# choice — this one is kept as the alternative that never exposes the repo, so
# both stay available without double-deploying. Swap the triggers to make this
# the default.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which version part to increment
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # push the version tag and create the release after deploying

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.qeet.in
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the latest v* tag is visible

      - name: Determine next version
        id: version
        env:
          # `type: choice` constrains this server-side, but keep it out of the
          # script body anyway so the run block never interpolates input.
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          latest=$(git tag --list 'v*' --sort=-version:refname | head -1)
          latest=${latest:-v0.0.0}
          IFS='.' read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            major) new_tag="v$((major + 1)).0.0" ;;
            minor) new_tag="v${major}.$((minor + 1)).0" ;;
            *)     new_tag="v${major}.${minor}.$((patch + 1))" ;;
          esac
          echo "Latest: $latest  ->  new: $new_tag"
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Gate the deploy on the same checks CI runs. Structural spec errors fail
      # here; documentation-quality gaps only report (see scripts/validate-specs.mjs).
      - name: Validate OpenAPI specs
        run: bun run validate:specs

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      # Runs `buildCommand` from vercel.json (`bun run build`), which emits the
      # Build Output API to .vercel/output via @astrojs/vercel. `VERCEL=1` is
      # set by the CLI, which is what makes the built portal call APIs directly
      # instead of through its server-side proxy — see src/config/scalar.ts.
      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

      # Tag + release only after a successful deploy, so every tag corresponds
      # to a live deployed version. Same convention as the other Qeet repos.
      - name: Push version tag and create GitHub release
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --repo "${GITHUB_REPOSITORY}"
          echo "released $VERSION"
