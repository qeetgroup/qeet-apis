name: deploy (public window)

# Deploys via Vercel's Git integration by making the repository public for the
# shortest possible time, then private again.
#
# Vercel's Hobby plan cannot clone a private *organization* repo, so the
# repository must be public at the moment Vercel clones it. This workflow opens
# that window deliberately and closes it immediately.
#
# ── Read this before enabling ──────────────────────────────────────────────
# The window is real exposure and it cannot be fully undone:
#   • Anyone who forks during the window keeps a PUBLIC copy permanently —
#     GitHub splits existing forks into a separate network when a repo goes
#     private again.
#   • Public push events are mirrored by third-party archives within seconds.
#   • This repo contains the full Qeet ID / Notify / Pay API surface and both
#     Postman collections.
# `.github/workflows/deploy.yml` deploys the same code with the repo staying
# private the entire time, and is the safer option if it ever fits.
#
# ── How the window is kept small ───────────────────────────────────────────
# Everything that does not need the repo public happens first: install, specs,
# typecheck, lint, tests. Only then is the repo flipped, the deployment
# triggered, awaited, and the repo flipped back. The close step runs with
# `if: always()`, so a failed or cancelled deploy still re-privatizes, and
# `close-public-window.yml` sweeps up if the runner dies outright.
#
# ── Required configuration ─────────────────────────────────────────────────
# Settings → Secrets and variables → Actions
#
#   GITHUB_TOKEN cannot change repository visibility, so this needs a token
#   with "Administration: read and write". Either option works:
#
#   Preferred — an org-owned GitHub App (not tied to one person, short-lived
#   tokens, survives someone leaving):
#     Variable  REPO_ADMIN_APP_ID           the App's ID
#     Secret    REPO_ADMIN_APP_PRIVATE_KEY  the App's .pem contents
#     Create at: org → Settings → Developer settings → GitHub Apps → New.
#     Permissions → Repository → Administration: Read and write. Then install
#     it on this repository only.
#
#   Simpler — a fine-grained PAT:
#     Secret    REPO_ADMIN_TOKEN
#     Create at https://github.com/settings/personal-access-tokens/new — note
#     this lives in your PERSONAL settings; pick `qeetgroup` in the
#     "Resource owner" dropdown, scope it to this repo, and grant
#     Administration: Read and write.
#   Secret    VERCEL_DEPLOY_HOOK   Vercel → Project → Settings → Git →
#                                  Deploy Hooks → create one for `main`
#   Secret    VERCEL_TOKEN         Account Settings → Tokens (to poll state)
#   Variable  VERCEL_PROJECT_ID    from .vercel/project.json
#   Variable  VERCEL_ORG_ID        from .vercel/project.json
#
# The organization must also allow members to change repository visibility
# (Org → Settings → Member privileges), or the PAT must belong to an owner.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Which version part to increment
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  # Never let two runs overlap: one could re-privatize while the other is still
  # waiting for Vercel to clone.
  group: deploy-public-window
  cancel-in-progress: false

permissions:
  contents: write # push the version tag and create the release after deploying

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://api.qeet.in
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the latest v* tag is visible

      # Computed before anything else so the number is known even if a later
      # step fails. Tags are only pushed after a successful deploy.
      - name: Determine next version
        id: version
        env:
          # `type: choice` constrains this server-side, but keep it out of the
          # script body anyway so the run block never interpolates input.
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          latest=$(git tag --list 'v*' --sort=-version:refname | head -1)
          latest=${latest:-v0.0.0}
          IFS='.' read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            major) new_tag="v$((major + 1)).0.0" ;;
            minor) new_tag="v${major}.$((minor + 1)).0" ;;
            *)     new_tag="v${major}.${minor}.$((patch + 1))" ;;
          esac
          echo "Latest: $latest  ->  new: $new_tag"
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # ── Everything below this line runs while the repo is still PRIVATE ──
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate OpenAPI specs
        run: bun run validate:specs

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test

      # Build locally too. A deploy that would fail on Vercel should fail here,
      # before the repo is ever exposed.
      - name: Build (fail before opening the window)
        run: bun run build
        env:
          VERCEL: "1"

      # Mint a short-lived installation token if the App is configured. Skipped
      # silently when it is not, so the PAT path keeps working.
      - name: Mint GitHub App token
        id: app_token
        if: ${{ vars.REPO_ADMIN_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.REPO_ADMIN_APP_ID }}
          private-key: ${{ secrets.REPO_ADMIN_APP_PRIVATE_KEY }}

      # ── The window opens here ───────────────────────────────────────────
      - name: Make repository public
        id: open
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.REPO_ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          # Fail with a readable message rather than a raw 401 from gh.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::No admin token available. Configure either the GitHub App (REPO_ADMIN_APP_ID + REPO_ADMIN_APP_PRIVATE_KEY) or a fine-grained PAT (REPO_ADMIN_TOKEN) with 'Administration: read and write'. GITHUB_TOKEN cannot change visibility. The repository was NOT made public and nothing was deployed."
            exit 1
          fi

          echo "opened_at=$(date -u +%s)" >> "$GITHUB_OUTPUT"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}" -F private=false >/dev/null
          echo "::warning::Repository is PUBLIC. Closing as soon as the deployment settles."

      - name: Trigger Vercel deployment
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK:-}" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK is not set — cannot trigger a deployment."
            exit 1
          fi
          # Vercel clones from GitHub for a Git-integration deploy, which is the
          # only reason the repo needs to be public at all.
          code=$(curl -sS -o /tmp/hook.json -w '%{http_code}' -X POST "$HOOK")
          echo "deploy hook HTTP $code"
          cat /tmp/hook.json
          test "$code" -ge 200 && test "$code" -lt 300

      - name: Wait for the deployment to finish cloning and building
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          TEAM_ID: ${{ vars.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          # Poll until the newest deployment leaves a pending state. Capped so a
          # stuck build can never hold the window open indefinitely — the close
          # step runs regardless.
          deadline=$(( $(date -u +%s) + 600 ))
          while :; do
            body=$(curl -sS -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v6/deployments?projectId=${PROJECT_ID}&teamId=${TEAM_ID}&limit=1")
            state=$(printf '%s' "$body" | jq -r '.deployments[0].state // "UNKNOWN"')
            url=$(printf '%s' "$body" | jq -r '.deployments[0].url // "?"')
            echo "state=$state url=$url"
            case "$state" in
              READY)
                echo "deployed: https://$url"
                break
                ;;
              ERROR|CANCELED)
                echo "::error::Vercel deployment finished as $state"
                exit 1
                ;;
            esac
            if [ "$(date -u +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out after 10 minutes waiting for Vercel (state=$state)"
              exit 1
            fi
            sleep 10
          done

      # ── The window closes here, whatever happened above ─────────────────
      - name: Make repository private again
        if: always() && steps.open.conclusion == 'success'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.REPO_ADMIN_TOKEN }}
          OPENED_AT: ${{ steps.open.outputs.opened_at }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}" -F private=true >/dev/null
          visibility=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.private')
          echo "private=$visibility"
          if [ "$visibility" != "true" ]; then
            echo "::error::Repository is STILL PUBLIC — re-privatize it by hand now."
            exit 1
          fi
          echo "window was open for $(( $(date -u +%s) - OPENED_AT ))s"

      - name: Report forks taken during the window
        if: always() && steps.open.conclusion == 'success'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.REPO_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          # Forks created while public survive as public repositories. Surfacing
          # the count is the only signal you get that it happened.
          forks=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.forks_count')
          echo "forks_count=$forks"
          if [ "$forks" != "0" ]; then
            echo "::warning::${forks} fork(s) exist. Forks taken while public stay public — review them."
          fi

      # Tag and release AFTER the deploy succeeds *and* after the window has
      # closed: every tag then corresponds to a live deployment, and tagging
      # never holds the repository public for longer than it has to.
      # Matches qeet-id-website / qeet-id-server deploy.yml.
      - name: Push version tag and create GitHub release
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --repo "${GITHUB_REPOSITORY}"
          echo "released $VERSION"
